name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub release with this tag (e.g. v0.1.6) from main. Leave empty to only build."
        required: false
        default: ""

# Read-only by default; only the release job below can write.
permissions:
  contents: read

env:
  HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: node --test

      - name: Sync web assets into Android project
        run: npx cap sync android

      # Without the signing secrets (a fork, or before they are set) the
      # build makes an unsigned APK instead of failing.
      - name: Restore release keystore
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > dsh-bot-release.p12
          cat > keystore.properties <<EOF
          storeFile=dsh-bot-release.p12
          storeType=PKCS12
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dsh-bot-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # Separate job so the write token never exists while npm ci, tests or the
  # Gradle build run. It only downloads the built APK and attaches it.
  release:
    needs: build
    # A pushed v* tag, or a manual run on main that names the tag to create.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - name: Check the tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release tag must look like v1.2.3, got '$TAG'"
            exit 1
          fi

      - name: Check the tag matches the app version
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: android/app/build.gradle
          sparse-checkout-cone-mode: false

      - name: Compare with versionName
        if: github.event_name == 'workflow_dispatch'
        run: |
          name=$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle | head -1)
          if [ "v$name" != "$TAG" ]; then
            echo "::error::tag $TAG does not match versionName $name in android/app/build.gradle"
            exit 1
          fi

      - name: Download APK artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dsh-bot-apk
          path: apk

      - name: Rename APK to dsh-bot-<tag>.apk
        run: |
          shopt -s nullglob
          files=(apk/*.apk)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::expected exactly 1 APK in apk/, found ${#files[@]}"
            exit 1
          fi
          mv "${files[0]}" "apk/dsh-bot-${TAG}.apk"
          ls -l apk/

      - name: Attach APK to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: apk/dsh-bot-${{ env.TAG }}.apk
          fail_on_unmatched_files: true
